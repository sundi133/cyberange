<!--
  Wazuh agent config for the CyberRange sidecar. It tails CyberRange's JSON
  event file and forwards to the manager, which evaluates local_rules.xml.
  Mounted at /var/ossec/etc/ossec.conf in the wazuh.agent service.
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <agent_name>cyberrange-agent</agent_name>
    </enrollment>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!-- The CyberRange event stream (one JSON object per line). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/cyberrange/events.json</location>
  </localfile>
</ossec_config>
