<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberRange · Control Plane</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <h1>CyberRange</h1>
        <p class="tagline">Red · Blue · Purple training &amp; validation</p>
      </div>
    </div>
    <div class="identity" id="identity">
      <div class="who">
        <span id="who-name" class="who-name">—</span>
        <span id="who-role" class="tag">—</span>
      </div>
      <button class="ghost" id="btn-logout">Log out</button>
      <span id="health" class="pill">checking…</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" data-view="learn" id="tab-learn" hidden>Learn</button>
    <button class="tab" data-view="classes" id="tab-classes" hidden>Classes</button>
    <button class="tab active" data-view="catalog">Catalog</button>
    <button class="tab" data-view="ranges">Ranges</button>
    <button class="tab" data-view="exercise">Exercise</button>
    <button class="tab" data-view="reference">Reference</button>
    <button class="tab" data-view="audit">Audit</button>
    <button class="tab" data-view="admin" id="tab-admin" hidden>Admin</button>
  </nav>

  <p class="view-help" id="view-help"></p>
  <main id="main"></main>

  <div id="login" class="login-overlay" hidden>
    <form class="login-card" id="login-form">
      <div class="brand" style="justify-content:center;margin-bottom:6px">
        <span class="logo">◈</span><h1 style="font-size:22px">CyberRange</h1>
      </div>
      <p class="muted" style="text-align:center;margin:0 0 6px">Sign in to your provisioned account</p>
      <label class="lbl">Username<input id="li-user" autocomplete="username" autofocus /></label>
      <label class="lbl">Password<input id="li-pass" type="password" autocomplete="current-password" /></label>
      <button class="act" type="submit" style="width:100%">Sign in</button>
      <p id="li-err" class="login-err"></p>
      <p class="muted" style="text-align:center;font-size:12px;margin:4px 0 0">
        First run seeds <span class="mono">admin</span> / <span class="mono">admin</span> — change it in the Admin panel.</p>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
