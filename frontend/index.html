<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberRange · Control Plane</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236D8DFF'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%230B0F17'%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">◈</span>
        <div class="brand-text">
          <strong>CyberRange</strong>
          <span>Red · Blue · Purple</span>
        </div>
      </div>

      <nav class="nav" id="tabs" aria-label="Sections">
        <p class="nav-group">Prepare</p>
        <button class="tab active" data-view="catalog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Catalog</span>
        </button>
        <button class="tab" data-view="ranges">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>
          <span>Ranges</span>
        </button>

        <p class="nav-group">Run</p>
        <button class="tab" data-view="exercise">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6,4 20,12 6,20"/></svg>
          <span>Exercise</span>
          <span class="nav-dot" id="nav-live" hidden></span>
        </button>
        <button class="tab" data-view="classes" id="tab-classes" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M7 11v5c0 1 2 3 5 3s5-2 5-3v-5"/></svg>
          <span>Classes</span>
        </button>

        <p class="nav-group">Review</p>
        <button class="tab" data-view="reference">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l4 4v12H5z"/><path d="M8 11h8M8 15h6"/></svg>
          <span>Reference</span>
        </button>
        <button class="tab" data-view="audit" id="tab-audit" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
          <span>Audit</span>
        </button>
        <button class="tab" data-view="admin" id="tab-admin" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
          <span>Admin</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <button class="icon-btn" id="btn-theme" title="Switch light / dark" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
        </button>
        <span id="health" class="pill">checking…</span>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="page-head">
          <h1 id="view-title">Catalog</h1>
          <p class="view-help" id="view-help"></p>
        </div>
        <div class="identity">
          <div class="who">
            <span id="who-name" class="who-name">-</span>
            <span id="who-role" class="tag role">-</span>
          </div>
          <button class="ghost" id="btn-logout">Log out</button>
        </div>
      </header>

      <main id="main"></main>
    </div>
  </div>

  <div id="login" class="login-overlay" hidden>
    <form class="login-card" id="login-form">
      <div class="login-brand">
        <span class="logo" aria-hidden="true">◈</span>
        <h2>CyberRange</h2>
        <p>Red, Blue and Purple team training</p>
      </div>
      <label class="lbl">Username
        <input id="li-user" autocomplete="username" placeholder="admin" autofocus />
      </label>
      <label class="lbl">Password
        <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>
      <button class="act lg" type="submit">Sign in</button>
      <p id="li-err" class="login-err"></p>
      <p class="login-hint">
        First run seeds <span class="mono">admin</span> / <span class="mono">admin</span>.
        Change it in the Admin panel.
      </p>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
